<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o meu amor</title>
    
    <script>
        // Bloqueia o clique com o botão direito
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Bloqueia atalhos de teclado
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                e.preventDefault();
            }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'S')) {
                e.preventDefault();
            }
        });

        // Bloqueia a seleção de texto
        document.onselectstart = function() { return false; };
    </script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: #e6e6fa !important; 
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
            text-align: center;
        }

        #question-container, #success-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        .img-container {
            width: 220px;
            height: 220px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background-color: #ffffff;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #444444;
            font-size: 16px;
            line-height: 1.5;
        }

        #mensagem-fuga {
            color: #dc3545;
            font-size: 18px;
            font-weight: bold;
            min-height: 28px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; 
            width: 100%;
            min-height: 60px;
        }

        button {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        #btn-yes {
            background-color: #28a745; 
            color: white;
            z-index: 10;
        }

        #btn-yes:hover {
            transform: scale(1.1); 
        }

        #btn-no {
            background-color: #dc3545; 
            color: white;
            z-index: 10;
        }

        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .confetti, .heart {
            position: absolute;
            top: -10vh;
            animation: fall linear forwards;
        }

        .heart {
            font-size: 24px;
        }

        @keyframes fall {
            0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="question-container">
        <div class="img-container">
            <!-- Puxando o seu arquivo do GitHub -->
            <img src="urso-pergunta.gif" alt="Ursinho fofo">
        </div>
        
        <h1>Você aceita ser minha namorada?</h1>
        
        <p id="mensagem-fuga"></p>
        
        <div class="buttons">
            <button id="btn-yes">SIM</button>
            <button id="btn-no">NÃO</button>
        </div>
    </div>

    <div id="success-container" class="hidden">
        <div class="img-container">
            <!-- Puxando o seu arquivo do GitHub -->
            <img src="urso-sucesso.gif" alt="Ursinhos se abraçando">
        </div>
        
        <h1>EBAAAAAAAA! Você me fez a pessoa mais feliz do mundo! ❤️</h1>
        <p>Prometo te fazer sorrir todos os dias e cuidar de você com todo o meu amor. Mal posso esperar para vivermos nossa história juntos!</p>
    </div>

    <div id="confetti-container" class="hidden"></div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const questionContainer = document.getElementById('question-container');
        const successContainer = document.getElementById('success-container');
        const confettiContainer = document.getElementById('confetti-container');
        const mensagemFuga = document.getElementById('mensagem-fuga');

        const frases = [
            "Tem certeza?",
            "Pense bem...",
            "Olha lá, hein!",
            "Vai clicar mesmo?",
            "Dá mais uma pensadinha...",
            "Certeza absoluta?",
            "Acho que você clicou errado..."
        ];

        let contadorFugas = 0;

        function fugir(e) {
            if (e) e.preventDefault();
            btnNo.style.position = 'fixed';
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const buttonWidth = btnNo.offsetWidth;
            const buttonHeight = btnNo.offsetHeight;
            
            const randomX = Math.floor(Math.random() * (windowWidth - buttonWidth));
            const randomY = Math.floor(Math.random() * (windowHeight - buttonHeight));
            
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';

            if (contadorFugas < frases.length) {
                mensagemFuga.innerText = frases[contadorFugas];
                contadorFugas++;
            } else {
                mensagemFuga.innerText = frases[frases.length - 1];
            }
        }

        btnNo.addEventListener('mouseover', fugir);
        btnNo.addEventListener('touchstart', fugir, { passive: false }); 
        btnNo.addEventListener('click', fugir);

        btnYes.addEventListener('click', () => {
            questionContainer.classList.add('hidden');
            successContainer.classList.remove('hidden');
            confettiContainer.classList.remove('hidden');
            iniciarChuva();
        });

        function iniciarChuva() {
            setInterval(() => {
                const el = document.createElement('div');
                
                if (Math.random() > 0.5) {
                    el.classList.add('heart');
                    el.innerText = Math.random() > 0.5 ? '❤️' : '💖';
                } else {
                    el.classList.add('confetti');
                    const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f9bec7', '#ffffff', '#ffd700'];
                    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (Math.random() * 10 + 5) + 'px';
                    el.style.height = (Math.random() * 20 + 10) + 'px';
                }

                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                
                confettiContainer.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 5000);
            }, 50); 
        }
    </script>
</body>
</html>
